name: Verify live DartScope media sources

on:
  push:
    branches: ['preview/dartscope-refresh-20260924']
    paths: ['.github/workflows/dartscope-source-check.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public Apple listing and product site
        run: |
          mkdir -p source-check
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          const sources = [
            ['apple-fi', 'https://apps.apple.com/fi/app/dartscope/id6760133199'],
            ['apple-us', 'https://apps.apple.com/us/app/dartscope/id6760133199'],
            ['lookup', 'https://itunes.apple.com/lookup?id=6760133199&country=fi'],
            ['product', 'https://dartscope.com/'],
          ];
          for (const [name, url] of sources) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
              const text = await response.text();
              await writeFile(`source-check/${name}.txt`, text);
              console.log(`SOURCE ${name} ${response.status} ${url}`);
              if (name === 'lookup') {
                const app = JSON.parse(text).results?.[0];
                console.log(JSON.stringify({version: app?.version, updated: app?.currentVersionReleaseDate, screenshotUrls: app?.screenshotUrls, ipadScreenshotUrls: app?.ipadScreenshotUrls}, null, 2));
              } else {
                const urls = [...new Set(text.replaceAll('\\/', '/').match(/https:\/\/[^\s"'<>\\]+(?:mzstatic|screenshot)[^\s"'<>\\]*/g) ?? [])];
                console.log(JSON.stringify(urls.slice(0, 100), null, 2));
                if (name === 'product') console.log(text.slice(0, 16000));
              }
            } catch (error) { console.log(`ERROR ${name}: ${error.message}`); }
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: dartscope-public-source-check
          path: source-check
          retention-days: 3
