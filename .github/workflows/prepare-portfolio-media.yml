name: Prepare portfolio reference media
on:
  push:
    branches: ['preview/consulting-cv-2026']
    paths: ['.github/workflows/prepare-portfolio-media.yml']
permissions:
  contents: read
jobs:
  media:
    if: github.ref == 'refs/heads/preview/consulting-cv-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/consulting-cv-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Capture public project imagery without bypassing access controls
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import sharp from 'sharp';
          import { mkdir, writeFile } from 'node:fs/promises';
          await mkdir('public/work', { recursive: true });
          const sources = [];
          for (const [name, id] of [['kovafit', '6758958067'], ['dartscope', '6760133199']]) {
            try {
              const url = `https://itunes.apple.com/lookup?id=${id}&country=fi`;
              const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
              if (!response.ok) throw new Error(`Apple lookup ${response.status}`);
              const app = (await response.json()).results?.[0];
              if (!app || !app.trackName.toLowerCase().includes(name)) throw new Error('App identity mismatch');
              const images = app.screenshotUrls || [];
              if (!images.length) throw new Error('No iPhone screenshots returned');
              for (const [index, imageURL] of images.slice(0, 2).entries()) {
                const imageResponse = await fetch(imageURL, { signal: AbortSignal.timeout(20000) });
                if (!imageResponse.ok) throw new Error(`Screenshot ${imageResponse.status}`);
                const bytes = Buffer.from(await imageResponse.arrayBuffer());
                const filename = `${name}-${index + 1}.webp`;
                await sharp(bytes).resize({ width: 720, withoutEnlargement: true }).webp({ quality: 88 }).toFile(`public/work/${filename}`);
                sources.push({ file: filename, source: imageURL, listing: app.trackViewUrl, capturedAt: new Date().toISOString() });
              }
              console.log(`Captured ${name} App Store screenshots`);
            } catch (error) { console.log(`MEDIA_UNAVAILABLE ${name}: ${error.message}`); }
          }
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1040 }, reducedMotion: 'reduce' });
            await page.goto('https://tmbeauty.fi/', { waitUntil: 'networkidle', timeout: 45000 });
            await page.waitForTimeout(1500);
            const content = await page.locator('body').innerText();
            console.log('TM Beauty page title:', await page.title());
            console.log('TM Beauty text:', content.slice(0, 700));
            if (/request is being verified|checking your browser|verify you are human/i.test(content) || !/beauty/i.test(content)) throw new Error('No accessible website content; no challenge bypass attempted');
            for (const label of ['Hylkää', 'Vain välttämättömät', 'Reject all']) {
              const button = page.getByRole('button', { name: label, exact: true });
              if (await button.count() === 1 && await button.isVisible()) { await button.click(); break; }
            }
            await page.evaluate(() => document.fonts.ready);
            const screenshot = await page.screenshot({ fullPage: false, animations: 'disabled' });
            await sharp(screenshot).webp({ quality: 88 }).toFile('public/work/tmbeauty.webp');
            sources.push({ file: 'tmbeauty.webp', source: 'https://tmbeauty.fi/', capturedAt: new Date().toISOString(), type: 'Actual homepage screenshot' });
          } catch (error) { console.log(`MEDIA_UNAVAILABLE tmbeauty: ${error.message}`); }
          finally { await browser.close(); }
          await writeFile('public/work/sources.json', JSON.stringify(sources, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-reference-media
          path: public/work
          retention-days: 7
      - name: Commit only reference media to preview branch
        run: |
          git add public/work
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: add captured client website and published app screenshots'
          git push origin HEAD:refs/heads/preview/consulting-cv-2026
