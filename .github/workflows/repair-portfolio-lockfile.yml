name: Repair preview package lock
on:
  push:
    branches: ['preview/consulting-cv-2026']
    paths: ['.github/workflows/repair-portfolio-lockfile.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.ref == 'refs/heads/preview/consulting-cv-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/consulting-cv-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the regenerated lock to the preview branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize npm lockfile with existing package manifest'
          git push origin HEAD:refs/heads/preview/consulting-cv-2026
