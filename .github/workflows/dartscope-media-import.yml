name: Import verified DartScope 1.0.6 media

on:
  push:
    branches: ['preview/dartscope-refresh-20260924']
    paths: ['.github/workflows/dartscope-media-import.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/dartscope-refresh-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Save published screenshots and provenance
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import sharp from 'sharp';
          const listing = 'https://apps.apple.com/fi/app/dartscope/id6760133199';
          const response = await fetch('https://itunes.apple.com/lookup?id=6760133199&country=fi', {signal: AbortSignal.timeout(30000)});
          assert(response.ok, 'Apple lookup must succeed');
          const app = (await response.json()).results?.[0];
          assert.equal(app?.trackId, 6760133199);
          assert.equal(app.version, '1.0.6', 'Only import the reviewed published release');
          const expected = [
            ['discover', '01-discover.png', 'Discover places to play', 'DartScope Discover screen with featured darts venues and Quick Match'],
            ['map', '02-map.png', 'Find a board nearby', 'DartScope map showing darts venues and their locations'],
            ['score', '03-score.png', 'Keep score at the board', 'DartScope live match scoring screen'],
            ['venues', '04-venues.png', 'Browse darts venues', 'DartScope venue list with search and filters'],
            ['game', '05-game.png', 'Set up your next match', 'DartScope match setup with game modes and player options'],
            ['details', '06-details.png', 'Know before you go', 'DartScope venue details with photos and board information'],
          ];
          assert.equal(app.screenshotUrls.length, expected.length);
          const screenshots = [];
          const capturedAt = new Date().toISOString();
          for (let i = 0; i < expected.length; i++) {
            const [id, filename, caption, alt] = expected[i];
            const source = app.screenshotUrls[i].replace(/\/\d+x\d+bb[^/]*$/, '/720x1560bb.webp');
            const url = new URL(source);
            assert.equal(url.hostname, 'is1-ssl.mzstatic.com');
            assert(url.pathname.includes(`/${filename}/`), `Unexpected screenshot: ${url.pathname}`);
            const result = await fetch(source, {signal: AbortSignal.timeout(30000)});
            assert(result.ok, `Screenshot download failed: ${source}`);
            const buffer = Buffer.from(await result.arrayBuffer());
            assert(buffer.length > 1000 && buffer.length < 5000000, 'Unexpected image size');
            const image = sharp(buffer);
            const metadata = await image.metadata();
            assert.equal(metadata.format, 'webp');
            assert(metadata.width > 600 && metadata.height > 1300, 'Screenshot must be full-resolution portrait');
            const file = `dartscope-1.0.6-${id}.webp`;
            await writeFile(`public/work/${file}`, buffer);
            screenshots.push({id, src: `/work/${file}`, alt, caption, width: metadata.width, height: metadata.height, source});
            console.log(`${file}: ${metadata.width}x${metadata.height}, ${buffer.length} bytes`);
          }
          await writeFile('src/data/dartscopeMedia.json', JSON.stringify({version: app.version, listing, releasedAt: app.currentVersionReleaseDate, capturedAt, screenshots}, null, 2) + '\n');
          const sources = JSON.parse(await readFile('public/work/sources.json', 'utf8')).filter(item => !item.file.startsWith('dartscope-'));
          sources.push(...screenshots.map(({src, source, width, height}) => ({file: src.split('/').at(-1), source, listing, appVersion: app.version, capturedAt, width, height})));
          await writeFile('public/work/sources.json', JSON.stringify(sources, null, 2) + '\n');
          JS
      - name: Commit only the imported media to the preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/work/dartscope-1.0.6-*.webp public/work/sources.json src/data/dartscopeMedia.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: capture DartScope 1.0.6 App Store screenshots'
            git push origin HEAD:preview/dartscope-refresh-20260924
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dartscope-1.0.6-media
          path: |
            public/work/dartscope-1.0.6-*.webp
            src/data/dartscopeMedia.json
          retention-days: 7
